apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  labels:
    app: dns
  namespace: custom-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns
      deployment: dns
  template:
    metadata:
      labels:
        app: dns
        deployment: dns
    spec:
      containers:
      - name: coredns-openshift
        image: quay.io/openshift/origin-coredns:4.16
        command: ["/usr/bin/coredns"]
        args: ["-dns.port","8053","-conf","/etc/coredns/Corefile"]
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault        
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true  
        volumeMounts:
        - mountPath: /etc/coredns
          name: dns-config
      volumes:
      - configMap:
          defaultMode: 420
          name: dns-config
        name: dns-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: dns
  name: dns
  namespace: custom-dns
spec:
  ports:
  - name: 8053-tcp
    port: 8053
    protocol: TCP
    targetPort: 8053
  - name: 8053-udp
    port: 8053
    protocol: UDP
    targetPort: 8053
  selector:
    app: dns
    deployment: dns