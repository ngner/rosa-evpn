apiVersion: operator.openshift.io/v1
kind: DNS
metadata:
  name: default
spec:
  servers:
  - name: ap-southeast-1.vpce.amazonaws.com
    zones:
    - ap-southeast-1.vpce.amazonaws.com
    forwardPlugin:
      policy: Random
      upstreams:
      - 172.30.42.104:8053
  - name: p3-openshiftapps
    zones:
    - p3.openshiftapps.com
    forwardPlugin:
      policy: Random
      upstreams:
      - 172.30.42.104:8053