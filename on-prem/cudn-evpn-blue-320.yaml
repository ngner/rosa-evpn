apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: blue-320
  labels:
    evpn: "true"
    advertise: "evpn"
spec:
  namespaceSelector:
    matchExpressions:
      - key: primary-cudn
        operator: In
        values:
          - blue-320
  network:
    topology: Layer2
    layer2:
      role: Primary
      ipam:
        lifecycle: Persistent
      subnets:
        - 172.25.220.0/24
      defaultGatewayIPs:
        - 172.25.220.1
      infrastructureSubnets:
        - 172.25.220.0/28          # .0–.15: gateway .1, mgmt .2, headroom
      reservedSubnets:
        - 172.25.220.16/28         # .16–.31: static IPs (shared)
        - 172.25.220.32/27         # .32–.63: static IPs (shared)
        - 172.25.220.64/28         # .64–.79: static IPs (shared)
        - 172.25.220.80/28         # .80–.95: unallocated
        - 172.25.220.96/28         # .96–.111: unallocated
        - 172.25.220.112/28        # .112–.127: unallocated
        - 172.25.220.160/27        # .160–.191: ROSA auto-assign pool
        - 172.25.220.192/26        # .192–.255: headroom
        # on-prem auto-assign pool: 172.25.220.128/27 (.128–.159)
    transport: EVPN
    evpn:
      vtep: evpn-vtep
      macVRF:
        vni: 10320
        routeTarget: 65004:10320

