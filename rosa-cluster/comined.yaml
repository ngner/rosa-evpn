---
apiVersion: k8s.ovn.org/v1
kind: RouteAdvertisements
metadata:
  name: evpn-on-prem-routeadvertisement
spec:
  targetVRF: auto
  advertisements:
    - PodNetwork
  nodeSelector: {}
  frrConfigurationSelector:
    matchLabels:
      evpn-peering: "on-prem"
  networkSelectors:
    - networkSelectionType: ClusterUserDefinedNetworks
      clusterUserDefinedNetworkSelector:
        networkSelector:
          matchLabels:
            evpn: "true"
---
apiVersion: frrk8s.metallb.io/v1beta1
kind: FRRConfiguration
metadata:
  name: evpn-bgp
  namespace: openshift-frr-k8s
  labels:
    evpn-peering: "on-prem"
spec:
  bgp:
    routers:
    - asn: 65021
      neighbors:
      - address: 10.101.103.3
        asn: 65004
        ebgpMultiHop: true
        disableMP: false
        dualStackAddressFamily: false
        toReceive:
          allowed:
            mode: all
      - address: 10.101.103.4
        asn: 65004
        ebgpMultiHop: true
        disableMP: false
        dualStackAddressFamily: false
        toReceive:
          allowed:
            mode: all
  nodeSelector: {}
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: blue-320
  labels:
    network: "evpn-on-prem"
    evpn: "true"
    advertise: "evpn"
spec:
  namespaceSelector:
    matchExpressions:
      - key: primary-cudn
        operator: In
        values:
          - blue-320
  network:
    topology: Layer2
    layer2:
      role: Primary
      mtu: 1400
      ipam:
        lifecycle: Persistent
      subnets:
        - 172.25.220.0/24
      defaultGatewayIPs:
        - 172.25.220.1
      infrastructureSubnets:
        - 172.25.220.0/28          # .0–.15: gateway .1, mgmt .2, headroom
      reservedSubnets:
        - 172.25.220.16/28         # .16–.31: static IPs (shared)
        - 172.25.220.32/27         # .32–.63: static IPs (shared)
        - 172.25.220.64/28         # .64–.79: static IPs (shared)
        - 172.25.220.80/28         # .80–.95: unallocated
        - 172.25.220.96/28         # .96–.111: unallocated
        - 172.25.220.112/28        # .112–.127: unallocated
        - 172.25.220.128/27        # .128–.159: on-prem auto-assign pool
        - 172.25.220.192/26        # .192–.255: headroom
        # ROSA auto-assign pool: 172.25.220.160/27 (.160–.191)
    transport: EVPN
    evpn:
      vtep: evpn-vtep
      macVRF:
        vni: 10320
        routeTarget: 65004:10320
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: green-319
  labels:
    network: "evpn-on-prem"
    evpn: "true"
    advertise: "evpn"
spec:
  namespaceSelector:
    matchExpressions:
      - key: primary-cudn
        operator: In
        values:
          - green-319
  network:
    topology: Layer2
    layer2:
      role: Primary
      mtu: 1400
      ipam:
        lifecycle: Persistent
      subnets:
        - 172.25.219.0/24
      defaultGatewayIPs:
        - 172.25.219.1
      infrastructureSubnets:
        - 172.25.219.0/28          # .0–.15: gateway .1, mgmt .2, headroom
      reservedSubnets:
        - 172.25.219.16/28         # .16–.31: static IPs (shared)
        - 172.25.219.32/27         # .32–.63: static IPs (shared)
        - 172.25.219.64/28         # .64–.79: static IPs (shared)
        - 172.25.219.80/28         # .80–.95: unallocated
        - 172.25.219.96/28         # .96–.111: unallocated
        - 172.25.219.112/28        # .112–.127: unallocated
        - 172.25.219.128/27        # .128–.159: on-prem auto-assign pool
        - 172.25.219.192/26        # .192–.255: headroom
        # ROSA auto-assign pool: 172.25.219.160/27 (.160–.191)
    transport: EVPN
    evpn:
      vtep: evpn-vtep
      macVRF:
        vni: 10319
        routeTarget: 65004:10319
      ipVRF:
        vni: 10000
        routeTarget: 65004:10000
---
# Namespace must carry the label that cudn-evpn-yellow.yaml selects on:
#   spec.namespaceSelector.matchExpressions: key=cudns, operator=In, values=[yellow]
# Apply the namespace first if it does not already exist:
#   oc apply -f test-pod-yellow.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: blue
  labels:
    k8s.ovn.org/primary-user-defined-network: ''
    kubernetes.io/metadata.name: blue
    localnet-vlan319: cudns
    primary-cudn: blue-320
---
# Test pod for verifying EVPN/CUDN "yellow" network reachability.
# The pod is scheduled onto the CUDN and receives an address from 172.25.115.0/24.
# Useful commands once inside the pod:
#   ping <peer-IP>          - basic L3 reachability
#   arping -I eth0 <IP>     - ARP / L2 reachability check
#   traceroute <peer-IP>    - path tracing
#   curl http://<peer-IP>   - HTTP reachability
#   ip addr                 - confirm 172.25.115.x address assignment
#   ip route                - inspect routing table / EVPN default route
#   arp -n                  - view ARP cache
apiVersion: v1
kind: Pod
metadata:
  name: nettest-blue-2
  namespace: blue
  labels:
    app: nettest-blue
    evpn: "true"
spec:
  nodeSelector:
    bgp_router: "true"
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
---
apiVersion: k8s.ovn.org/v1
kind: VTEP
metadata:
  name: evpn-vtep
spec:
  cidrs:
   - 10.10.0.0/17
  mode: Unmanaged