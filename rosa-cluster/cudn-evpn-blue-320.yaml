# CUDN blue-320 (VLAN/VNI 320 family on the fabric).
# Same EVPN shape as green-319; subnet 172.25.220.0/24.
#
# ROSA manages:
#   .32–.63   (172.25.220.32/27)  static
#   .160–.191 (172.25.220.160/27) auto-assign
# dl380 manages (reserved here so ROSA does not allocate them):
#   .64–.95   (172.25.220.64/27)  dl380 static
# dl380 auto-assign .128–.159 is intentionally not reserved on ROSA
# (see reservedSubnets list vs dl380 CUDN).
#
# ACM: source-crs/evpn/cudn-evpn-rosa-blue-320.yaml
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: blue-320
  labels:
    evpn: "true"
    advertise: "evpn"
spec:
  namespaceSelector:
    matchExpressions:
      - key: primary-cudn
        operator: In
        values:
          - blue-320
  network:
    topology: Layer2
    layer2:
      role: Primary
      mtu: 1350
      ipam:
        lifecycle: Persistent
      subnets:
        - 172.25.220.0/24
      defaultGatewayIPs:
        - 172.25.220.1
      infrastructureSubnets:
        - 172.25.220.0/29          # .0–.7: gateway .1, mgmt .2, headroom
      reservedSubnets:
        - 172.25.220.8/29          # .8–.15: static assignment only (MTV preserveStaticIPs)
        - 172.25.220.16/28         # .16–.31: external static IPs (shared)
        - 172.25.220.32/27         # .32–.63: ROSA static pool
        - 172.25.220.64/27         # .64–.95: reserved for dl380 static pool
        - 172.25.220.96/27         # .96–.127: unallocated
        - 172.25.220.160/27        # .160–.191: ROSA auto-assign pool
        - 172.25.220.192/26        # .192–.255: headroom
    transport: EVPN
    evpn:
      vtep: evpn-vtep
      macVRF:
        vni: 10320
        routeTarget: 65004:10320
      ipVRF:
        vni: 20320
        routeTarget: 65004:20320
