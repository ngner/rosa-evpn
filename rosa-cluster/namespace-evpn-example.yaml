# Example namespaces selected onto CUDNs via primary-cudn=<cudn-name>.
# Required label for primary UDN: k8s.ovn.org/primary-user-defined-network: ""
apiVersion: v1
kind: Namespace
metadata:
  name: blue
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    primary-cudn: blue-320
---
apiVersion: v1
kind: Namespace
metadata:
  name: green
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    primary-cudn: green-319
---
apiVersion: v1
kind: Namespace
metadata:
  name: evpn-on-prem-vms
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    primary-cudn: blue-320
